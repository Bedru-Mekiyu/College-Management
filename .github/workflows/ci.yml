name: CI Pipeline

on:
  push:
    branches: [ main, master, jules-* ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-checks:
    name: Backend Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci || npm install

      - name: Check backend syntax & start dry-run
        run: |
          cd backend
          node --check index.js

  frontend-checks:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Run frontend tests
        run: |
          cd frontend
          npm test -- --watchAll=false --passWithNoTests

      - name: Build frontend
        run: |
          cd frontend
          npm run build
